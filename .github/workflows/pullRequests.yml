name: Pull Requests
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  constants:
    name: Create constants
    outputs:
      global-cache-key: ${{ steps.global-cache-key.outputs.global-cache-key }}
      run-cache-key: ${{ steps.run-cache-key.outputs.run-cache-key }}
      is-fork-pr: ${{ steps.is-fork-pr.outputs.is-fork-pr }}
      changed-packages: ${{ steps.detect-changed-packages.outputs.changed-packages }}
      latest-webiny-version: ${{ steps.latest-webiny-version.outputs.latest-webiny-version }}
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/checkout@v4.3.1
    - name: Create global cache key
      id: global-cache-key
      run: echo "global-cache-key=${{ github.base_ref }}-${{ runner.os }}-$(/bin/date -u "+%m%d")-${{ vars.RANDOM_CACHE_KEY_SUFFIX }}" >> "$GITHUB_OUTPUT"
    - name: Create workflow run cache key
      id: run-cache-key
      run: echo "run-cache-key=${{ github.run_id }}-${{ github.run_attempt }}-${{ vars.RANDOM_CACHE_KEY_SUFFIX }}" >> "$GITHUB_OUTPUT"
    - name: Is a PR from a fork
      id: is-fork-pr
      run: echo "is-fork-pr=${{ github.event.pull_request.head.repo.fork }}" >> "$GITHUB_OUTPUT"
    - name: Detect changed files
      id: detect-changed-files
      uses: dorny/paths-filter@v3
      with:
        filters: |
          changed:
            - 'packages/**/*'
        list-files: json
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG constants: before Detect changed packages"
        CHANGED_FILES='${{ toJSON(steps.detect-changed-files.outputs.changed_files) }}'
        IS_FORK_PR='${{ toJSON(steps.is-fork-pr.outputs.is-fork-pr) }}'
        printf '%s\n' "GERALT_DBG detect-changed-files.changed_files=$CHANGED_FILES"
        printf '%s\n' "GERALT_DBG is-fork-pr=$IS_FORK_PR"
      continue-on-error: true
    - name: Detect changed packages
      id: detect-changed-packages
      run: echo "changed-packages=$(node .github/workflows/wac/utils/runNodeScripts/listChangedPackages.js '${{ steps.detect-changed-files.outputs.changed_files }}')" >> "$GITHUB_OUTPUT"
    - name: Get latest Webiny version on NPM
      id: latest-webiny-version
      run: echo "latest-webiny-version=$(npm view @webiny/cli version)" >> "$GITHUB_OUTPUT"
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  build:
    name: Build
    needs: constants
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/checkout@v4.3.1
      with:
        path: ${{ github.base_ref }}
    - uses: actions/cache@v4
      with:
        path: ${{ github.base_ref }}/.yarn/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
    - uses: actions/cache@v4
      with:
        path: ${{ github.base_ref }}/.webiny/cached-packages
        key: ${{ needs.constants.outputs.global-cache-key }}
    - name: Install dependencies
      run: yarn --immutable
      working-directory: ${{ github.base_ref }}
    - name: Build packages
      run: yarn build
      working-directory: ${{ github.base_ref }}
    - uses: actions/cache@v4
      with:
        path: ${{ github.base_ref }}/.webiny/cached-packages
        key: ${{ needs.constants.outputs.run-cache-key }}
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  vitest-constants:
    needs:
    - constants
    - build
    name: Vitest (No storage) - Constants
    outputs:
      vitest-test-commands: ${{ steps.list-vitest-test-commands.outputs.vitest-test-commands }}
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/checkout@v4.3.1
      with:
        path: ${{ github.base_ref }}
    - id: list-vitest-test-commands
      name: List Vitest Test Commands
      working-directory: ${{ github.base_ref }}
      run: echo "vitest-test-commands=$(node .github/workflows/wac/utils/runNodeScripts/listVitestTestCommands.js '["", ${{ needs.constants.outputs.changed-packages }}]')" >> "$GITHUB_OUTPUT"
    - name: Packages to test with Vitest
      id: list-packages
      run: echo '${{ steps.list-vitest-test-commands.outputs.vitest-test-commands }}'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  vitest-run:
    needs:
    - constants
    - build
    - vitest-constants
    name: ${{ matrix.testCommand.title }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        node:
        - 24
        testCommand: ${{ fromJSON(needs.vitest-constants.outputs.vitest-test-commands) }}
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      AWS_REGION: eu-central-1
    if: needs.vitest-constants.outputs.vitest-test-commands != '[]'
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/checkout@v4.3.1
      with:
        path: ${{ github.base_ref }}
    - uses: actions/cache@v4
      with:
        path: ${{ github.base_ref }}/.yarn/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
    - uses: actions/cache@v4
      with:
        path: ${{ github.base_ref }}/.webiny/cached-packages
        key: ${{ needs.constants.outputs.run-cache-key }}
    - name: Install dependencies
      run: yarn --immutable
      working-directory: ${{ github.base_ref }}
    - name: Build packages
      run: yarn build
      working-directory: ${{ github.base_ref }}
    - name: Run tests
      run: ${{ matrix.testCommand.cmd }}
      working-directory: ${{ github.base_ref }}
  vitest-ddb-constants:
    needs:
    - constants
    - build
    name: Vitest (DDB) - Constants
    outputs:
      vitest-test-commands: ${{ steps.list-vitest-test-commands.outputs.vitest-test-commands }}
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/checkout@v4.3.1
      with:
        path: ${{ github.base_ref }}
    - id: list-vitest-test-commands
      name: List Vitest Test Commands
      working-directory: ${{ github.base_ref }}
      run: echo "vitest-test-commands=$(node .github/workflows/wac/utils/runNodeScripts/listVitestTestCommands.js '["ddb", ${{ needs.constants.outputs.changed-packages }}]')" >> "$GITHUB_OUTPUT"
    - name: Packages to test with Vitest
      id: list-packages
      run: echo '${{ steps.list-vitest-test-commands.outputs.vitest-test-commands }}'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  vitest-ddb-run:
    needs:
    - constants
    - build
    - vitest-ddb-constants
    name: ${{ matrix.testCommand.title }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        node:
        - 24
        testCommand: ${{ fromJSON(needs.vitest-ddb-constants.outputs.vitest-test-commands) }}
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      AWS_REGION: eu-central-1
      WEBINY_STORAGE: ddb
    if: needs.vitest-ddb-constants.outputs.vitest-test-commands != '[]'
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Configure AWS Credentials
      run: |-
        echo "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE" >> "$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=dummy-secret-access-key" >> "$GITHUB_ENV"
        echo "AWS_SESSION_TOKEN=dummy-session-token" >> "$GITHUB_ENV"
        echo "GERALT_DBG configure-aws-credentials mocked (fork cannot obtain official OIDC role)"
    - uses: actions/checkout@v4.3.1
      with:
        path: ${{ github.base_ref }}
    - uses: actions/cache@v4
      with:
        path: ${{ github.base_ref }}/.yarn/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
    - uses: actions/cache@v4
      with:
        path: ${{ github.base_ref }}/.webiny/cached-packages
        key: ${{ needs.constants.outputs.run-cache-key }}
    - name: Install dependencies
      run: yarn --immutable
      working-directory: ${{ github.base_ref }}
    - name: Build packages
      run: yarn build
      working-directory: ${{ github.base_ref }}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG vitest-ddb-run: pre-sink snapshot"
        printf '%s\n' "GERALT_DBG AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-<unset>}"
        printf '%s\n' "GERALT_DBG AWS_SECRET_ACCESS_KEY=$([ -n "${AWS_SECRET_ACCESS_KEY:-}" ] && echo '<set>' || echo '<unset>')"
        printf '%s\n' "GERALT_DBG AWS_SESSION_TOKEN=$([ -n "${AWS_SESSION_TOKEN:-}" ] && echo '<set>' || echo '<unset>')"
        printf '%s\n' "GERALT_DBG AWS_REGION=${AWS_REGION:-<unset>}"
        printf '%s\n' "GERALT_DBG WEBINY_STORAGE=${WEBINY_STORAGE:-<unset>}"
        CMD='${{ toJSON(matrix.testCommand.cmd) }}'
        printf '%s\n' "GERALT_DBG matrix.testCommand.cmd=$CMD"
        if command -v aws >/dev/null 2>&1; then printf '%s\n' "GERALT_DBG aws-cli present"; else printf '%s\n' "GERALT_DBG aws-cli absent"; fi
      continue-on-error: true
    - name: Run tests
      run: ${{ matrix.testCommand.cmd }}
      working-directory: ${{ github.base_ref }}
    permissions:
      id-token: write
  vitest-ddb-os-constants:
    needs:
    - constants
    - build
    name: Vitest (DDB+OS) - Constants
    outputs:
      vitest-test-commands: ${{ steps.list-vitest-test-commands.outputs.vitest-test-commands }}
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/checkout@v4.3.1
      with:
        path: ${{ github.base_ref }}
    - id: list-vitest-test-commands
      name: List Vitest Test Commands
      working-directory: ${{ github.base_ref }}
      run: echo "vitest-test-commands=$(node .github/workflows/wac/utils/runNodeScripts/listVitestTestCommands.js '["ddb-os,ddb", ${{ needs.constants.outputs.changed-packages }}]')" >> "$GITHUB_OUTPUT"
    - name: Packages to test with Vitest
      id: list-packages
      run: echo '${{ steps.list-vitest-test-commands.outputs.vitest-test-commands }}'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  vitest-ddb-os-run:
    needs:
    - constants
    - build
    - vitest-ddb-os-constants
    name: ${{ matrix.testCommand.title }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        node:
        - 24
        testCommand: ${{ fromJSON(needs.vitest-ddb-os-constants.outputs.vitest-test-commands) }}
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      AWS_REGION: eu-central-1
      WEBINY_STORAGE: ddb-os,ddb
      AWS_OPENSEARCH_DOMAIN_NAME: ${{ secrets.AWS_OPEN_SEARCH_3_DOMAIN_NAME}}
      OPENSEARCH_ENDPOINT: ${{ secrets.OPEN_SEARCH_3_ENDPOINT }}
      OPENSEARCH_INDEX_PREFIX: ${{ matrix.testCommand.id }}
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::726952677045:role/GitHubActionsWebinyJs
        aws-region: eu-central-1
    - uses: actions/checkout@v4.3.1
      with:
        path: ${{ github.base_ref }}
    - uses: actions/cache@v4
      with:
        path: ${{ github.base_ref }}/.yarn/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
    - uses: actions/cache@v4
      with:
        path: ${{ github.base_ref }}/.webiny/cached-packages
        key: ${{ needs.constants.outputs.run-cache-key }}
    - name: Install dependencies
      run: yarn --immutable
      working-directory: ${{ github.base_ref }}
    - name: Build packages
      run: yarn build
      working-directory: ${{ github.base_ref }}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG vitest-ddb-os-run: pre-sink snapshot"
        IS_FORK='${{ toJSON(needs.constants.outputs.is-fork-pr) }}'
        printf '%s\n' "GERALT_DBG is-fork-pr=$IS_FORK"
        printf '%s\n' "GERALT_DBG AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-<unset>}"
        printf '%s\n' "GERALT_DBG AWS_SECRET_ACCESS_KEY=$([ -n "${AWS_SECRET_ACCESS_KEY:-}" ] && echo '<set>' || echo '<unset>')"
        printf '%s\n' "GERALT_DBG AWS_SESSION_TOKEN=$([ -n "${AWS_SESSION_TOKEN:-}" ] && echo '<set>' || echo '<unset>')"
        printf '%s\n' "GERALT_DBG OPENSEARCH_ENDPOINT=$([ -n "${OPENSEARCH_ENDPOINT:-}" ] && echo '<set>' || echo '<unset>')"
        printf '%s\n' "GERALT_DBG AWS_OPENSEARCH_DOMAIN_NAME=$([ -n "${AWS_OPENSEARCH_DOMAIN_NAME:-}" ] && echo '<set>' || echo '<unset>')"
        CMD='${{ toJSON(matrix.testCommand.cmd) }}'
        printf '%s\n' "GERALT_DBG matrix.testCommand.cmd=$CMD"
      continue-on-error: true
    - name: Run tests
      run: ${{ matrix.testCommand.cmd }}
      working-directory: ${{ github.base_ref }}
    permissions:
      id-token: write
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on: pull_request
